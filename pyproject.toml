[project]
name = "vllm-serving-bench"
version = "0.1.0"
description = "Benchmark OpenAI-compatible vLLM serving endpoints."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "pyyaml>=6.0.1",
  "pydantic>=2.7.0",
  "rich>=13.7.0"
]

[project.scripts]
vllm-serving-bench = "vllm_serving_bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
